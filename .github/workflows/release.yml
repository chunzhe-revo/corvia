name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: corvia-cli-linux-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: corvia-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: corvia-x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev cmake protobuf-compiler

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: Enable sccache (if available)
        if: steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Build release binaries
        run: cargo build --release -p corvia --target ${{ matrix.target }}

      - name: Prepare release assets (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/release/corvia ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

          # ORT execution provider shared libraries (cp -L resolves symlinks from ort cache)
          for lib in libonnxruntime_providers_shared libonnxruntime_providers_cuda libonnxruntime_providers_openvino; do
            src="target/${{ matrix.target }}/release/${lib}.so"
            if [ -e "$src" ]; then
              cp -L "$src" "${lib}-linux-amd64.so"
            fi
          done

      - name: Prepare release assets (macOS)
        if: runner.os == 'macOS'
        run: |
          cp target/${{ matrix.target }}/release/corvia corvia
          chmod +x corvia
          tar -czf ${{ matrix.asset_name }}.tar.gz corvia
          rm corvia

      - name: Create GitHub release (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.asset_name }}
            libonnxruntime_providers_*-linux-amd64.so
          generate_release_notes: true

      - name: Create GitHub release (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.asset_name }}.tar.gz
          generate_release_notes: false
